<template>
    <lightning-card title="Parent Component">
        <template for:each={productList} for:item="product">
            <div key={product.Id}>
                <lightning-button 
                  variant="base"
                  label={product.Name} 
                  onclick={handleClick}
                  name={product.Id} 
                  class="slds-var-m-left_x-small"
                ></lightning-button>
            </div>
            <template for:each={priceOfTheSelectedProduct} for:item="selectedProduct">
                <div key={selectedProduct.Id}>
                    Price Of The Product  = {selectedProduct.UnitPrice}
                </div>
            </template>
        </template>
    </lightning-card>
</template>
